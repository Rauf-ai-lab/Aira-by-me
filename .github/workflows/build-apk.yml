name: Build Debug APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "Verifying Java environment..."
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Java version could not be detected." >&2
            exit 1
          fi
          MAJOR_VER=$(echo "$JAVA_VER" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $MAJOR_VER"
          if ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "Error: Failed to parse numeric Java major version from '$MAJOR_VER'." >&2
            exit 1
          fi
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "Error: Java version must be 17 or newer, but detected major version $MAJOR_VER." >&2
            exit 1
          fi
          echo "Java environment verified: major version $MAJOR_VER."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Debug keystore already exists at ./debug.keystore"
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore" >&2
            exit 1
          fi
          echo "Debug keystore verified successfully."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK output
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected APK not found at $EXPECTED_APK" >&2
            echo "Searching for APK files in app/build/outputs/apk:" >&2
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk" >&2
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: APK file at $EXPECTED_APK is empty." >&2
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: $EXPECTED_APK does not have .apk extension." >&2; exit 1 ;;
          esac
          echo "Successfully verified debug APK at $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]+/-/g' | sed -E 's/^-+|-+$//g')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi
          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TMP_ASSET_DIR="/tmp/aira_release_asset_${GITHUB_RUN_NUMBER}"
          mkdir -p "$TMP_ASSET_DIR"
          ASSET_PATH="${TMP_ASSET_DIR}/${ASSET_NAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Failed to prepare release asset at $ASSET_PATH" >&2
            exit 1
          fi

          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty at $ASSET_PATH" >&2
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          cat << 'EOF' > /tmp/release_notes.md
          ### Automatic Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${{ github.run_number }}
          - **Workflow Run Attempt:** ${{ github.run_attempt }}
          - **Commit SHA:** ${{ github.sha }}
          - **Artifact Name:** app-debug-apk

          > **Testing Notice:** This APK is intended for testing purposes only. It is signed with a temporary debug keystore and is not a Play Store production release.
          EOF

          echo "Creating GitHub Release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release_notes.md \
            --target "$GITHUB_SHA" \
            --latest

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_ENV"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
            ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"

            echo "=================================================="
            echo "GitHub Release published successfully!"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Release Asset: $ASSET_NAME"
            echo "=================================================="

            gh release view "$RELEASE_TAG" || true

            {
              echo "### 🚀 APK Build & GitHub Release Summary"
              echo ""
              echo "- **Status:** ✅ Successfully published to GitHub Releases"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release URL:** [View Release and Download APK](${RELEASE_URL})"
              echo "- **APK Filename:** \`${ASSET_NAME}\`"
              echo ""
              echo "You can download the APK directly from the **Assets** section of the release above."
              echo ""
              echo "> 📦 **Backup:** The standard GitHub Actions artifact \`app-debug-apk\` is also available on this workflow run page."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "=================================================="
            echo "WARNING: GitHub Release publishing failed or was skipped."
            echo "The debug APK was successfully built and uploaded as an Actions artifact."
            echo "Artifact name: app-debug-apk"
            echo "=================================================="

            {
              echo "### ⚠️ APK Build & Artifact Summary"
              echo ""
              echo "- **Build Status:** ✅ Debug APK successfully built"
              echo "- **Artifact Status:** ✅ Uploaded as GitHub Actions artifact (\`app-debug-apk\`)"
              echo "- **Release Status:** ⚠️ GitHub Release publishing encountered an issue or was skipped"
              echo ""
              echo "You can download the APK directly from the **Artifacts** section on this workflow summary page."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
