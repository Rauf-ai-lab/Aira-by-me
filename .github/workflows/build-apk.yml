name: Build & Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java Installation ==="
          java -version
          echo "JAVA_HOME is set to: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set!"
            exit 1
          fi
          
          JAVA_VER_STRING=$(java -version 2>&1 | head -n 1)
          echo "Detected version string: $JAVA_VER_STRING"
          
          MAJOR_VERSION=$(echo "$JAVA_VER_STRING" | sed -E 's/.*version "([0-9]+).*/\1/')
          
          if ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not detect numeric Java major version from '$JAVA_VER_STRING'."
            exit 1
          fi
          
          echo "Active Java Major Version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Java major version must be 17 or higher (detected $MAJOR_VERSION)."
            exit 1
          fi
          echo "Java environment verification successful."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking debug keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to verify ./debug.keystore presence after generation!"
            exit 1
          fi
          echo "debug.keystore verified successfully."

      - name: Build debug APK
        run: |
          echo "=== Building Debug APK ==="
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          echo "=== Verifying Debug APK Output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK!"
            echo "Searching inside app/build/outputs/apk for any discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" -type f
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: The output APK at $EXPECTED_APK is empty (0 bytes)!"
            exit 1
          fi
          
          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || wc -c < "$EXPECTED_APK")
          echo "Verified APK: $EXPECTED_APK ($APK_SIZE bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing Release Asset ==="
          RAW_REPO_NAME="${{ github.repository }}"
          REPO_SHORT=$(echo "$RAW_REPO_NAME" | awk -F'/' '{print $2}' | tr -cd 'a-zA-Z0-9_-')
          if [ -z "$REPO_SHORT" ]; then
            REPO_SHORT="android-app"
          fi
          
          ASSET_NAME="${REPO_SHORT}-debug-build-${{ github.run_number }}.apk"
          TEMP_ASSET_DIR="${RUNNER_TEMP}/apk_release_asset"
          mkdir -p "$TEMP_ASSET_DIR"
          
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="${TEMP_ASSET_DIR}/${ASSET_NAME}"
          
          cp "$SRC_APK" "$DEST_APK"
          
          if [ ! -f "$DEST_APK" ] || [ ! -s "$DEST_APK" ]; then
            echo "ERROR: Release asset copy failed or file is empty: $DEST_APK"
            exit 1
          fi
          
          echo "Prepared release asset: $DEST_APK"
          echo "asset_path=$DEST_APK" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing to GitHub Releases ==="
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist or is empty at '$ASSET_PATH'!"
            exit 1
          fi
          
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_NOTES=$(cat << 'EOF'
          ### Debug APK Build

          - **Build Type:** Automatically generated debug APK
          - **Build System:** GitHub Actions
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** `${{ github.sha }}`
          - **Target Branch:** `${{ github.ref_name }}`

          > **Note:** This APK is intended for testing and development purposes. It is signed with a temporary debug keystore and is not intended for Play Store production release.
          EOF
          )
          
          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Release and Artifact Summary ==="
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "GitHub Release published successfully."
            gh release view "$RELEASE_TAG" || true
            
            REPO_URL="${{ github.server_url }}/${{ github.repository }}"
            RELEASE_URL="${REPO_URL}/releases/tag/${RELEASE_TAG}"
            
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"
            
            {
              echo "###  Debug APK Ready for Download"
              echo ""
              echo "- **Direct Release Link:** [$RELEASE_TITLE]($RELEASE_URL)"
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **APK Filename:** \`$ASSET_NAME\`"
              echo ""
              echo "You can download the APK directly to your Android device from the **Assets** section of the [Release Page]($RELEASE_URL)."
              echo ""
              echo "The standard GitHub Actions artifact (\`app-debug-apk\`) is also preserved in the workflow run summary as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was not completed or encountered an issue."
            echo "The debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' was uploaded successfully."
            
            {
              echo "### ⚠️ GitHub Release Notice"
              echo ""
              echo "- **APK Build:** Succeeded"
              echo "- **Artifact Upload:** Succeeded (\`app-debug-apk\`)"
              echo "- **Release Publishing:** Encountered an error or was skipped"
              echo ""
              echo "You can download the verified debug APK from the **Artifacts** section at the bottom of this GitHub Actions workflow run page."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
